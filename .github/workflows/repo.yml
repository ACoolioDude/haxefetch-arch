name: Arch Linux Haxefetch repo container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/PKGBUILD'
      - 'src/**'
      - 'bin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Mark workspace safe
        run: |
          pacman -Sy --noconfirm git pacman-contrib
          git config --global --add safe.directory "*"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          safe_directory: '*'

      - name: Create non-root user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Generate Checksums & Build Package
        run: |
          cd "$GITHUB_WORKSPACE/source"
          chown -R builder:builder .
          
          # Run updpkgsums as builder user
          su builder -c "updpkgsums"
          
          # Build package as builder user
          su builder -c "makepkg -sc --noconfirm"

      - name: Update repository database
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p x86_64
          mv source/*.pkg.tar.zst x86_64/ 2>/dev/null || true
          cd x86_64
          repo-add -n -R haxefetch.db.tar.zst *.pkg.tar.zst
          
          rm -f haxefetch.db haxefetch.files
          cp haxefetch.db.tar.zst haxefetch.db
          cp haxefetch.files.tar.zst haxefetch.files

      - name: Commit and push updated repo and PKGBUILD
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add x86_64/ source/PKGBUILD
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update checksums & build repo [skip ci]"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main
