name: Build Arch Linux Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'source/PKGBUILD'
      - 'src/**'
      - 'bin/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize pacman and install dependencies
        run: |
          pacman -Sy --noconfirm git pacman-contrib

      - name: Create non-root build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Generate Checksums & Build Package
        run: |
          cd source
          
          # Fix directory permissions for builder
          chown -R builder:builder .
          
          # Run updpkgsums as builder user to update sha256sums safely
          su builder -c "updpkgsums"
          
          # Build the package as builder user
          su builder -c "makepkg -sc --noconfirm"

      - name: Update repository database
        run: |
          mkdir -p x86_64
          mv source/*.pkg.tar.zst x86_64/ 2>/dev/null || true
          cd x86_64
          repo-add -n -R haxefetch.db.tar.zst *.pkg.tar.zst
          
          # Replace symlinks with real file copies for GitHub Pages compatibility
          rm -f haxefetch.db haxefetch.files
          cp haxefetch.db.tar.zst haxefetch.db
          cp haxefetch.files.tar.zst haxefetch.files

      - name: Commit and push updated repo and PKGBUILD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add x86_64/ source/PKGBUILD
          git status
          git diff-index --quiet HEAD || git commit -m "Auto-update checksums & build repo [skip ci]"
          git push
  
